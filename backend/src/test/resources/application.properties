spring.application.name=Contractor

# Tests use their own database, same credentials as the dev database
spring.datasource.url=jdbc:postgresql://localhost:5432/contractor_test
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Rebuild the test schema from schema.sql every time a test context starts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:reset-schema.sql,classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Fixed key for tests only, never used outside them
app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Photos written by tests go to the build folder, so "gradle clean" removes them
app.upload-dir=build/test-uploads

app.base-url=http://localhost:8080
