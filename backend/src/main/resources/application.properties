spring.application.name=Contractor

# Railway sets PORT, locally it's 8080
server.port=${PORT:8080}

# Database - the standard Postgres variables (Railway sets them). Host, port and database default to the
# local dev database, username and password have no default.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:contractor}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# schema.sql is applied to the database by hand, never by Spring or Hibernate
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Errors are returned in the RFC 9457 Problem Details format
spring.mvc.problemdetails.enabled=true

# JWT signing key, at least 32 bytes. No default, so the app doesn't start without it.
app.jwt.secret=${APP_JWT_SECRET}

# Photo uploads: one file per request, max 10 MB. The request limit leaves room for the multipart overhead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Folder for the photo files, relative to the working directory
app.upload-dir=./uploads

# Absolute address of the backend, for the photo <img> tags in the printable documents
app.base-url=${APP_BASE_URL:http://localhost:8080}
