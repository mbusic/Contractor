spring.application.name=Contractor

# Database - username and password come from environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/contractor
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# schema.sql is applied to the database by hand, never by Spring or Hibernate
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Errors are returned in the RFC 9457 Problem Details format
spring.mvc.problemdetails.enabled=true

# JWT signing key, at least 32 bytes. No default, so the app doesn't start without it.
app.jwt.secret=${APP_JWT_SECRET}
